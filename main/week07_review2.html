<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>개피곤하다</title>
        <style>
            .p1 {
                font-family: "Times New Roman";
                font-size: 28px;
                font-weight: bold;
                font-style: italic;
            }
            .p2 {
                text-align: right;
            }
            .p3 {
                text-align: justify;
                text-decoration: line-through;
            }
            .p4 {
                letter-spacing: 10px;
            }
            .p5 {
                line-height: 100px;
            }
            div {
                background-color: paleturquoise;
                height: 300px;
                width: 300px;
            }
            .p6 {
                line-height: 300px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <p class="p1">내일, 강우 상태가 예상됩니다. 비가 올 확률은 100%입니다.</p>
        <p class="p2">현재의 대기질 지수는 70 수준으로, 어제 이 시간과 비슷합니다.</p>
        <p class="p3">바람으로 인해 체감 온도가 실제 기온보다 더 낮게 느껴집니다.</p>
        <p class="p4">남은 하루 동안 자외선 지수가 낮겠습니다.</p>
        <p class="p5">내일 44mm의 강수가 예상됩니다.</p>
        <div><p class="p6">저 진짜 이것만 하고 자겠습니다.</p></div>
    </body>
</html>
