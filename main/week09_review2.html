<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>실험(?)하자</title>
        <style>
            .d1 {
                width: 300px;
                height: 200px;
                background-color: pink;
                
            }
            .d2 {
                width: 300px;
                height: 200px;
                background-color: aqua;
                
            }
            .w1 {
                margin: 40px;
            }
            .d3 {
                width: 300px;
                height: 200px;
                background-color: yellow;
                display: inline-block;
            }
            .w2 {
                padding: 40px;
            }
            .d4 {
                width: 300px;
                height: 200px;
                background-color: silver;
                padding: 40px;
                box-sizing: border-box;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <div class="d1">
            <h1>보조배터리 기본</h1>
        </div>
        <div class="d2">
            <h1 class="w1">보조배터리 margin</h1>
        </div>
        <div class="d3">
            <h1 class="w2">보조배터리 padding1</h1>
        </div>
        <div class="d4">
            <h1 class="w3">보조배터리 padding2</h1>
        </div>
    </body>
</html>
